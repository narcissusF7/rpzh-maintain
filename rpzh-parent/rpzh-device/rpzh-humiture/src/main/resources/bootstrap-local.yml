server:
  port: 16901
spring:
  application:
    name: rpzh-maintain-humiture
  cloud:
    nacos:  # 注册中心地址
      discovery:
        server-addr: 127.0.0.1:8848
      config: # 配置中心地址
        server-addr: 127.0.0.1:8848
        # 配置文件格式
        file-extension: yml
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    #hikari:
    #max-lifetime: 1800000       #在连接池中的存活时间  Yl123456
    url: jdbc:mysql://127.0.0.1:3306/rpzh-device?useUnicode=true&characterEncoding=UTF-8&serverTimezone=GMT%2B8&allowMultiQueries=true
    username: root
    password: root123
  redis:
    host: 127.0.0.1
    port: 6379
    password: redis123
logging:
  level:
    io.swagger.models.parameters.AbstractSerializableParameter: error
# mqtt 连接配置
mqtt:
  # 本机 Docker Mosquitto（原外网 183.250.89.188:7426 不可达）
  host: tcp://127.0.0.1
  port: 1883
  qos: 0
  timeout: 2000
  keepalive: 20
  # 与 rpzh-function 对齐，便于本机联调；设备侧入站 Handler 暂为注释状态，只建立连接与订阅
  rx-topic: maintain/#
  tx-topic: applicationserver/#
  # 各 device 子模块 local 原本都用 rpiot-client-co2，同 broker 会互相踢线，这里用唯一 id
  client-id: rpiot-device-humiture
  username: admin
  password: admin1234.
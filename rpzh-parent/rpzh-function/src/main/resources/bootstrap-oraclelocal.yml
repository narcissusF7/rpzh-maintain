    port: 5672
    password: guest
    username: guest
  #将druid自动配置剔除
  autoconfigure:
    exclude: com.alibaba.druid.spring.boot.autoconfigure.DruidDataSourceAutoConfigure
  datasource:
    dynamic:
      #默认这里选择默认数据
      primary: oracle
      strict: false
      datasource:
        #可以配置多个
        oracle:
          url: jdbc:oracle:thin:@192.168.3.36:1521:helowin
          username: RPZH_FUNCTION
          password: root
          driver-class-name: oracle.jdbc.driver.OracleDriver
        clickhouse:
          url: jdbc:clickhouse://183.250.89.188:8123/default
          username: default
          password:
          driver-class-name: ru.yandex.clickhouse.ClickHouseDriver
        db2:
          url: jdbc:db2://10.154.74.199:50000/TRADECTR
          username: nb_yzh
          password: 3tsg5Rw#
          driver-class-name: com.ibm.db2.jcc.DB2Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 10
      min-idle: 10
      max-active: 500
      max-wait: 60000

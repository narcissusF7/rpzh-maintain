logging:
  level:
    io.swagger.models.parameters.AbstractSerializableParameter: error
    root: info
    org.springframework: info
    com.rpzh.dao: DEBUG  #sql日志打印
printTime:
  cron: 0/10 * * * * ?

#hystrix 配置
hystrix:
  command:
    default:
      execution:
        isolation:
          thread:
            timeoutInMilliseconds: 6000   #连接超时时间
          strategy: SEMAPHORE              #线程池隔离采用信号量隔离
ribbon:
  ReadTimeout: 30000
  ConnectTimeout: 30000
# mqtt 连接配置
mqtt:
  host: tcp://114.132.182.218
  port: 1883
  qos: 0
  timeout: 2000
  keepalive: 20
  rx-topic: maintain/#
  tx-topic: applicationserver/#
  client-id: rpiot-client-${random.uuid}
  username: admin
  password: admin1234.
rocketmq:
  name-server: 192.168.3.36:9876
  topic: messageTopic # mq主题
  producer:
    group: MessageGroup

node:
  voltage: 3.0
  signalStrength: -15
time:
  cron : 0 0 0/2 * * *
#  frequency : 7200
  nodeTask : 0 0 6,18 * * *

pagehelper:
  auto-runtime-dialect: true
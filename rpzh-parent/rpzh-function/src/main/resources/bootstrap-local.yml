server:
  port: 16900
spring:
  application:
    name: rpzh-function
  cloud:
    nacos:  # 注册中心地址
      discovery:
        server-addr: 127.0.0.1:8848
      config: # 配置中心地址
        server-addr: 127.0.0.1:8848
        # 配置文件格式
        file-extension: yml
  redis:
    host: 127.0.0.1
    port: 6379
    password: redis123
    jedis:
      pool:
        max-active: 32
        max-idle: 32
        min-idle: 0
  main:
    allow-bean-definition-overriding: true
  autoconfigure:
    # 使用 dynamic-datasource 管理多数据源，排除 Druid 的 DataSource 自动配置（否则会因缺少 spring.datasource.url 启动失败）
    exclude: com.alibaba.druid.spring.boot.autoconfigure.DruidDataSourceAutoConfigure
  datasource:
    dynamic:
      #默认这里选择默认数据
      primary: mysql
      strict: false
      datasource:
        #可以配置多个
        mysql:
          url: jdbc:mysql://127.0.0.1:3306/rpzh-system?useUnicode=true&characterEncoding=UTF-8&allowMultiQueries=true&serverTimezone=GMT%2B8
          username: root
          password: root123
          driver-class-name: com.mysql.jdbc.Driver
        clickhouse:
          url: jdbc:clickhouse://127.0.0.1:8123/default
          username: default
          password:
          driver-class-name: ru.yandex.clickhouse.ClickHouseDriver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 10
      min-idle: 10
      max-active: 500
      max-wait: 60000
      test-on-borrow: false
      test-on-return: false
      test-while-idle: true
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 30000
      validation-query: select 'x'
      max-open-prepared-statements: 50
      max-pool-prepared-statement-per-connection-size: 20
      #druid不支持clickhouse需要将防火墙去掉
      filters: config,stat
  #  datasource:
  #    driver-class-name: com.mysql.jdbc.Driver
  #    url: jdbc:mysql://127.0.0.1:3306/tabac_maintenance_function?useUnicode=true&characterEncoding=UTF-8&serverTimezone=GMT%2B8&allowMultiQueries=true
  #    username: root
  #    password: root
logging:
  level:
    io.swagger.models.parameters.AbstractSerializableParameter: error
    root: info
    org.springframework: info
    com.rpzh.dao: DEBUG  #sql日志打印
printTime:
  cron: 0/10 * * * * ?

#hystrix 配置
hystrix:
  command:
    default:
      execution:
        isolation:
          thread:
            timeoutInMilliseconds: 6000   #连接超时时间
          strategy: SEMAPHORE              #线程池隔离采用信号量隔离
ribbon:
  ReadTimeout: 30000
  ConnectTimeout: 30000
# mqtt 连接配置
mqtt:
  host: tcp://127.0.0.1 # 本机 Docker Mosquitto（原 192.168.3.99 局域网设备，本机不可达）
  port: 1883
  qos: 0
  timeout: 2000
  keepalive: 20
  rx-topic: maintain/#
  tx-topic: applicationserver/#
  client-id: rpiot-client-${random.uuid}
  username: admin
  password: admin1234.
rocketmq:
  name-server: 127.0.0.1:9876 # 本机 Docker RocketMQ (rmqnamesrv)
  topic: messageTopic # mq主题
  producer:
    group: MessageGroup

# 设备异常状态判定（也可在 tb_general_setting 中以 setting_key=nodeAbnormal 覆盖，改库即生效）
node:
  abnormal:
    enabled: true
    cron: "0 0/10 * * * ?"   # 每 10 分钟扫描一次
    timeout-hours: 48         # 超过 48 小时未收到已入垛设备的数据 -> 异常
    max-error-count: 3        # 设备连续发出异常数据满 3 次 -> 异常

# 预警误报冷却（也可在 tb_general_setting 中以 setting_key=warningSuppress / setting_name=cooldownMinutes 覆盖，改库即生效）
# 误报后同一位置 / 设备的同类型数据在该窗口内只落库、不再判定预警；数据恢复正常会提前解除
warning:
  suppress:
    cooldown-minutes: 120

server:
  port: 18883
spring:
  application:
    name: rpzh-oauth
  redis:
    database: 0
    timeout: 3000
    password: rpzh123456.
    cluster:
      nodes: 192.168.1.3:8001,192.168.1.4:8002,192.168.1.11:8003,192.168.1.3:8004,192.168.1.4:8005,192.168.1.11:8006
    lettuce:
      pool:
        max-idle: 50
        min-idle: 10
        max-active: 100
        max-wait: 1000
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://192.168.1.3:33061/rpzh-system?useUnicode=true&characterEncoding=UTF-8&serverTimezone=GMT%2B8&allowMultiQueries=true
    username: root
    password: rpzh123456.
    #hikari:
    #max-lifetime: 500000   seata-test:测试事务数据库    rpzh-system
  main:
    allow-bean-definition-overriding: true
  cloud:
    nacos:  # 注册中心地址
      discovery:
        server-addr: 192.168.1.3:11808,192.168.1.4:11809,192.168.1.11:11810
      config: # 配置中心地址
        server-addr: 192.168.1.3:11808,192.168.1.4:11809,192.168.1.11:11810
        # 配置文件格式
        file-extension: yml
        #alibaba:
        #seata:
        #tx-service-group: my_test_tx_group
oauth:
  ttl: 36000  #token存储到redis的过期时间
  clientId: rpzh    #客户端id        用于判断服务是否被授权
  clientSecret: rpzh   #客户端秘钥  用于判断服务是否被授权
  cookieDomain: localhost
  cookieMaxAge: -1
encrypt:
  key-store:
    location: classpath:/fjxmrpzh.jks    #证书 ---包含公钥和私钥,公钥加密,私钥解密
    secret: fjxmrpzh           #秘钥
    alias: fjxmrpzh           #证书的别名
    password: fjxmrpzh         #证书的密码
feign:  #开启feign熔断器,当feign调用失败时熔断
  hystrix:
    enabled: true
#hystrix 配置
hystrix:
  command:
    default:
      execution:
        isolation:
          thread:
            timeoutInMilliseconds: 30000   #连接超时时间
          strategy: SEMAPHORE              #线程池隔离采用信号量隔离
      #seata:
      #tx-service-group: my_test_tx_group
      #registry:
      #type: nacos
      #nacos:
      #server-addr: 127.0.0.1:8866
      #application: seata-server
      #username: nacos
      #password: nacos
      #group: SEATA_GROUP
      #config:
      #type: nacos
      #nacos:
      #server-addr: 127.0.0.1:8866
      #username: nacos
      #password: nacos
      #namespace: "6feb15dc-6ece-4c26-b302-6bc8d0c6b6ce"
      #group: SEATA_GROUP
server:
  port: 16888
spring:
  application:
    name: rpzh-oauth
  redis:
    host: 127.0.0.1
    port: 6379
    password:
    jedis:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://120.24.91.199:3306/tabac_maintenance_system?useUnicode=true&characterEncoding=UTF-8&serverTimezone=GMT%2B8&allowMultiQueries=true
    username: root
    password: root
    #hikari:
    #max-lifetime: 500000   seata-test:测试事务数据库    rpzh-system
  main:
    allow-bean-definition-overriding: true
  cloud:
    nacos:  # 注册中心地址
      discovery:
        server-addr: 127.0.0.1:8877
      config: # 配置中心地址
        server-addr: 127.0.0.1:8877
        # 配置文件格式
        file-extension: yml
      #alibaba:
        #seata:
        #tx-service-group: my_test_tx_group
oauth:
  ttl: 36000  #token存储到redis的过期时间
  clientId: rpzh    #客户端id        用于判断服务是否被授权
  clientSecret: rpzh   #客户端秘钥  用于判断服务是否被授权
  cookieDomain: localhost
  cookieMaxAge: -1
encrypt:
  key-store:
    location: classpath:/fjxmrpzh.jks    #证书 ---包含公钥和私钥,公钥加密,私钥解密
    secret: fjxmrpzh           #秘钥
    alias: fjxmrpzh           #证书的别名
    password: fjxmrpzh         #证书的密码
feign:  #开启feign熔断器,当feign调用失败时熔断
  hystrix:
    enabled: true
#hystrix 配置
hystrix:
  command:
    default:
      execution:
        isolation:
          thread:
            timeoutInMilliseconds: 30000   #连接超时时间
          strategy: SEMAPHORE              #线程池隔离采用信号量隔离

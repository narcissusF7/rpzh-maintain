server:
  port: 16888
spring:
  application:
    name: rpzh-oauth
  redis:
    host: 127.0.0.1
    port: 6379
    password: redis123
    jedis:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/rpzh-system?useUnicode=true&characterEncoding=UTF-8&serverTimezone=GMT%2B8&allowMultiQueries=true
    username: root
    password: root123
    #hikari:
    #max-lifetime: 500000   seata-test:测试事务数据库    rpzh-system
  main:
    allow-bean-definition-overriding: true
  cloud:
    nacos:  # 注册中心地址
      discovery:
        server-addr: 127.0.0.1:8848
      config: # 配置中心地址
        server-addr: 127.0.0.1:8848
        # 配置文件格式
        file-extension: yml
      #alibaba:
        #seata:
        #tx-service-group: my_test_tx_group
oauth:
  ttl: 36000  #token存储到redis的过期时间
  clientId: rpzh    #客户端id        用于判断服务是否被授权
  clientSecret: rpzh   #客户端秘钥  用于判断服务是否被授权
  cookieDomain: localhost
  cookieMaxAge: -1
encrypt:
  key-store:
    location: classpath:/fjxmrpzh.jks    #证书 ---包含公钥和私钥,公钥加密,私钥解密
    secret: fjxmrpzh           #秘钥
    alias: fjxmrpzh           #证书的别名
    password: fjxmrpzh         #证书的密码
# ============ 中台（统一身份认证 IdP）SSO 接入 ============
# 启用后：登录页"中台账号登录"按钮跳转中台授权页；账号/权限来源切换为中台。
# 关闭后：维持本地账号密码登录，完全不依赖中台（默认）。
platform:
  sso:
    enabled: false
    authorize-uri: https://sso.example.com/oauth2/authorize
    token-uri: https://sso.example.com/oauth2/token
    user-info-uri: https://sso.example.com/oauth2/userinfo
    client-id: rpzh-maintain
    client-secret: changeMe
    # 必须等于在中台注册的 redirect_uri（经网关暴露，网关会剥离 /api 前缀）
    redirect-uri: http://localhost:8080/api/user/sso/callback
    scope: openid profile
    # 登录成功回跳前端页面（token 以 ?token=bearer xxx 带回）
    frontend-return-uri: http://localhost:5173/login
    # 中台账号首次登录自动开户时赋予的本地默认角色（对应 tb_role.role_key）
    default-role-key: common
    cookie-max-age: -1
feign:  #开启feign熔断器,当feign调用失败时熔断
  hystrix:
    enabled: true
#hystrix 配置
hystrix:
  command:
    default:
      execution:
        isolation:
          thread:
            timeoutInMilliseconds: 30000   #连接超时时间
          strategy: SEMAPHORE              #线程池隔离采用信号量隔离

server:
  port: 15888
spring:
  application:
    name: rpzh-file
  main:
    allow-bean-definition-overriding: true
  cloud:
    nacos:  # 注册中心地址
      discovery:
        server-addr: 10.46.150.174:8866
      config: # 配置中心地址
        server-addr: 10.46.150.174:8866
        # 配置文件格式
        file-extension: yml
  redis:
    host: 10.46.150.173
    port: 6379
    password:
    jedis:
      pool:
        max-active: 32
        max-idle: 32
        min-idle: 0
  servlet:
    multipart:
      max-file-size: 10MB    #单个文件大小
      max-request-size: 10MB   #文件传输大小
  datasource:
    driver-class-name: oracle.jdbc.driver.OracleDriver
    url: jdbc:oracle:thin:@10.46.150.173:1521:helowin
    username: TEST_FUNCTION
    password: rpzh123456.

logging:
  level:
    root: info
    org.springframework: info
    com.rpzh.dao: info  #sql日志打印
feign:  #开启feign熔断器,当feign调用失败时熔断
  hystrix:
    enabled: true
#hystrix 配置
hystrix:
  command:
    default:
      execution:
        isolation:
          thread:
            timeoutInMilliseconds: 6000   #连接超时时间
          strategy: SEMAPHORE              #线程池隔离采用信号量隔离
fastdfs:
  ip: 10.46.150.172:8080
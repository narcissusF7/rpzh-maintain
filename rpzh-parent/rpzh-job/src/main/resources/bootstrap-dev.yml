server:
  port: 18882
spring:
  application:
    name: rpzh-system
  main:
    allow-bean-definition-overriding: true
  cloud:
    nacos:  # 注册中心地址
      discovery:
        server-addr: 192.168.1.3:11808,192.168.1.4:11809,192.168.1.11:11810
      config: # 配置中心地址
        server-addr: 192.168.1.3:11808,192.168.1.4:11809,192.168.1.11:11810
        # 配置文件格式
        file-extension: yml
        #alibaba:
        #seata:
        #tx-service-group: my_test_tx_group
  datasource:
    master:
      driver-class-name: com.mysql.jdbc.Driver
      #hikari:
      #max-lifetime: 1800000       #在连接池中的存活时间
      url: jdbc:mysql://192.168.1.3:33061/rpzh-system?useUnicode=true&characterEncoding=UTF-8&serverTimezone=GMT%2B8&allowMultiQueries=true
      username: root
      password: rpzh123456.
    second:
      driver-class-name: com.mysql.jdbc.Driver
      url: jdbc:mysql://192.168.1.3:33061/rpzh-iot?useUnicode=true&characterEncoding=UTF-8&serverTimezone=GMT%2B8&allowMultiQueries=true
      username: root
      password: rpzh123456.
logging:
  level:
    root: info
    org.springframework: info
    com.rpzh.dao: DEBUG  #sql日志打印
# mybatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.rpzh.pojo
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath:com.rpzh.dao/**/*.xml
feign:  #开启feign熔断器,当feign调用失败时熔断
  hystrix:
    enabled: true
#hystrix 配置
hystrix:
  command:
    default:
      execution:
        isolation:
          thread:
            timeoutInMilliseconds: 6000   #连接超时时间
          strategy: SEMAPHORE              #线程池隔离采用信号量隔离
      #seata:
      #tx-service-group: my_test_tx_group
      #registry:
      #type: nacos
      #nacos:
      #server-addr: 127.0.0.1:8866
      #application: seata-server
      #username: nacos
      #password: nacos
      #group: SEATA_GROUP
      #config:
      #type: nacos
      #nacos:
      #server-addr: 127.0.0.1:8866
      #username: nacos
      #password: nacos
      #namespace: "6feb15dc-6ece-4c26-b302-6bc8d0c6b6ce"
      #group: SEATA_GROUP

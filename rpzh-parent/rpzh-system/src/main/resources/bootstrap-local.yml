server:
  port: 16883
spring:
  application:
    name: rpzh-maintain-system
  main:
    allow-bean-definition-overriding: true
  cloud:
    nacos:  # 注册中心地址
      discovery:
        server-addr: 127.0.0.1:8866
      config: # 配置中心地址
        server-addr: 127.0.0.1:8866
        # 配置文件格式
        file-extension: yml
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://192.168.3.36:3306/tabac_maintenance_system?useUnicode=true&characterEncoding=UTF-8&serverTimezone=GMT%2B8&allowMultiQueries=true
    username: root
    password: root
logging:
  level:
    root: info
    org.springframework: info
    com.rpzh.dao: DEBUG  #sql日志打印
# mybatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.rpzh.pojo
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath:com.rpzh.dao/**/*.xml
feign:  #开启feign熔断器,当feign调用失败时熔断
  hystrix:
    enabled: true
#hystrix 配置
hystrix:
  command:
    default:
      execution:
        isolation:
          thread:
            timeoutInMilliseconds: 6000   #连接超时时间
          strategy: SEMAPHORE              #线程池隔离采用信号量隔离
rocketmq:
  name-server: 192.168.3.36:9876
  topic: UserManageTopic # mq主题
  producer:
    group: springBootGroup
